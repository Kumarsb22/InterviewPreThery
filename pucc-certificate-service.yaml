spring: 
 servlet:
   multipart:
     enabled: true
     max-file-size: 2MB
     max-request-size: 2MB

 datasource:
   url: jdbc:postgresql://localhost:5432/puc-certificate
   username: postgres
   password: nic@123
   driver-class-name: org.postgresql.Driver

 jpa:
   hibernate:
     ddl-auto: update
   show-sql: true
   properties:
     hibernate:
       format_sql: true
   database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
 port: 9096

management:
       endpoints:
         web:
           exposure:
             include: "*"   
eureka:
  client:
     register-with-eureka: true
     fetch-registry: true
     service-url:
       defaultZone: http://localhost:8761/eureka/
